[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Het app-manifest met het juiste type serveren, zodat telefoons het herkennen.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Altijd de nieuwste versie van het spel laden.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
