[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Het app-manifest met het juiste type serveren, zodat telefoons het herkennen.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# De service worker nooit uit de cache serveren, zodat updates meteen doorkomen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
